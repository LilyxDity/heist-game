<!doctype html>
<html lang="en">
<head>

<title>The Midnight Vault — a one-room stealth heist</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #070a13;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;

    display: block;

  }

<canvas id="game" width="1280" height="720"></canvas>
